name: Build CLI

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Install Linux integration dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Full native race suite
        run: go test -race -p 2 ./... -timeout=300s
      - name: Real Linux sandbox
        if: runner.os == 'Linux'
        run: go test ./internal/tools -run '^(TestProbeSandbox|TestBashSandboxReal)$' -count=1 -v
      - name: Fixed scenario baseline
        run: go run ./cmd/harness-eval > "$RUNNER_TEMP/scenario-baseline.json"
      - name: Build and launch native archive
        run: |
          go run ./cmd/harness-package -targets "$(go env GOOS)/$(go env GOARCH)" -version ci -out "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP"/release/*.tar.gz -C "$RUNNER_TEMP/extracted"
          HARNESS_PACKAGED_DIR="$RUNNER_TEMP/extracted" go test ./cmd/harness -run '^TestPackagedSibling$' -count=1 -timeout=60s
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scenario-${{ runner.os }}
          path: ${{ runner.temp }}/scenario-baseline.json

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      # Shell/process integration is covered by Linux/macOS. Windows supports
      # native file/session/provider paths; bash requires a separate installation.
      - name: Portable native race suite
        run: go test -race ./internal/llm ./internal/config ./internal/session ./internal/toolargs ./internal/turnbudget ./internal/uimode ./internal/textutil ./internal/release -timeout=180s
      - name: Build and launch native archive
        shell: pwsh
        run: |
          go run ./cmd/harness-package -targets windows/amd64 -version ci -out "$env:RUNNER_TEMP/release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "$env:RUNNER_TEMP/release/harness-ci-windows-amd64.zip" "$env:RUNNER_TEMP/extracted"
          $env:HARNESS_PACKAGED_DIR = "$env:RUNNER_TEMP/extracted"
          go test ./cmd/harness -run '^TestPackagedSibling$' -count=1 -timeout=60s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: Build release archives
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          go run ./cmd/harness-package -version "$RELEASE_VERSION" -out dist
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: harness-archives
          path: dist/
          retention-days: 30

  release:
    needs: [native, windows, archives]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: harness-archives
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes
