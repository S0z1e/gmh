name: Build CLI

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race, TUI)
        run: go test -race ./internal/tui/

      - name: Build and cross-compile
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            ext=""
            [ "$goos" = windows ] && ext=".exe"
            GOOS=$goos GOARCH=$goarch go build -o "dist/harness-$goos-$goarch$ext" ./cmd/harness
            GOOS=$goos GOARCH=$goarch go build -o "dist/harness-tui-$goos-$goarch$ext" ./cmd/harness-tui
          done
          ls -la dist/

      - name: Smoke test (linux/amd64)
        run: ./dist/harness-linux-amd64 -h

      - uses: actions/upload-artifact@v4
        with:
          name: harness-binaries
          path: dist/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harness-binaries
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
